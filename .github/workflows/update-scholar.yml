name: Update Scholar data

# Refreshes src/data/scholar.json from the Google Scholar profile, commits it if
# anything changed, and then asks deploy.yml to publish the result.
#
# The explicit dispatch at the end is not redundant: a push made with the
# built-in GITHUB_TOKEN deliberately does not trigger other workflows, so
# deploy.yml would never fire on its own here. Dispatching it by API does work,
# which is why this job needs actions: write.
#
# Scholar has no public API and rate-limits the datacenter IP ranges that GitHub
# runners use, so a scheduled run may come back with a CAPTCHA instead of data.
# update_scholar.py treats that as a no-op and leaves the committed JSON alone,
# so a blocked run stays green and the site keeps the last good numbers. Use the
# "Run workflow" button to force a refresh attempt at any time.

on:
  schedule:
    # Mondays, 06:15 UTC. Deliberately off the hour, as Actions sheds scheduled
    # runs when the on-the-hour queue is congested.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Scholar data
        run: python scripts/update_scholar.py

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- src/data/scholar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to src/data/scholar.json; nothing to publish."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/scholar.json
          git commit -m 'Refresh Scholar data'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the refreshed data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
